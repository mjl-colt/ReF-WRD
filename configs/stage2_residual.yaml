stage: stage2_residual_correction
entry: train_fde_sr.py
training_stage: stage2
seed: 42
resume_from: preset/models/refwrd_stage1_base.pkl

optimization:
  learning_rate: 1.0e-4
  train_batch_size: 4
  gradient_accumulation_steps: 1
  mixed_precision: fp16
  checkpointing_steps: 500

loss:
  lambda_stage2_rec: 1.0
  lambda_stage2_lpips: 0.2
  lambda_fde_wavelet: 1.0
  lambda_fde_residual: 0.5
  lambda_fde_high: 0.0
  wavelet_ll_weight: 0.2
  wavelet_high_weight: 1.0

module:
  fde_hidden_dim: 128
  fde_prompt_hidden_dim: 256
  fde_num_tokens: 77
  fde_token_rank: 16
  fde_latent_channels: 4
  fde_num_blocks: 6
  fde_residual_scale: 0.5

degradation:
  config: dataloaders/params_realesrgan.yml

notes:
  - "Stage-II freezes Stage I and FDPL and trains the latent residual branch."
  - "It does not introduce an additional diffusion reverse sampling trajectory."

